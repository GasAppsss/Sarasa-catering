    function useScrollReveal(options = {}) {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        if (!ref.current) return;
        const observer = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setIsVisible(true); observer.disconnect(); } },
          { threshold: 0.12, rootMargin: '0px 0px -40px 0px', ...options }
        );
        observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      return [ref, isVisible];
    }

    function useCountUp(target, duration = 1400) {
      const [value, setValue] = useState(0);
      const rafRef = useRef();
      useEffect(() => {
        const start = performance.now();
        const from = 0;
        const to = Number(target) || 0;
        const tick = (now) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          setValue(Math.floor(from + (to - from) * eased));
          if (t < 1) rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [target, duration]);
      return value;
    }

    function useMagnetic(strength = 14) {
      const ref = useRef(null);
      const handleMove = useCallback((e) => {
        const el = ref.current;
        if (!el) return;
        const r = el.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        el.style.transform = `translate(${(x / r.width) * strength}px, ${(y / r.height) * strength}px)`;
      }, [strength]);
      const handleLeave = useCallback(() => {
        if (ref.current) ref.current.style.transform = 'translate(0,0)';
      }, []);
      return { ref, onMouseMove: handleMove, onMouseLeave: handleLeave };
    }

    function Reveal({ children, delay = 0, y = 24, className = '', as: Tag = 'div' }) {

          style={{ transitionDelay: `${delay}ms`, '--reveal-y': `${y}px` }}

          {children}
        </Tag>
      );
    }

    function AnimatedCounter({ value, prefix = 'Rp ', className = '' }) {

      return (

    /* ============================================================

    function App() {
      const [activeMode, setActiveMode] = useState('customer');
      const [packages, setPackages] = useState(() => {
        try { const s = localStorage.getItem('sarasa_pkgs_v2'); return s ? JSON.parse(s) : INITIAL_PACKAGES; } catch { return INITIAL_PACKAGES; }
      });
      const [orders, setOrders] = useState(() => {
        try { const s = localStorage.getItem('sarasa_orders_v2'); return s ? JSON.parse(s) : getInitialOrders(); } catch { return getInitialOrders(); }
      });

      useEffect(() => { try { localStorage.setItem('sarasa_pkgs_v2', JSON.stringify(packages)); } catch {} }, [packages]);
      useEffect(() => { try { localStorage.setItem('sarasa_orders_v2', JSON.stringify(orders)); } catch {} }, [orders]);

      const [toastMessage, setToastMessage] = useState(null);
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage((p) => (p === msg ? null : p)), 3500);
      };

      const activeOrdersCount = useMemo(() => orders.filter((o) => o.status !== 'Selesai').length, [orders]);

      const calendarDates = useMemo(() => {
        const manualFullOffsets = [2, 6];
        const result = [];
        for (let i = 1; i <= 14; i++) {
          const dateStr = getDateOffset(i);
          const ordersOnDate = orders.filter((o) => o.eventDate === dateStr);
          const bookedPax = ordersOnDate.reduce((sum, o) => sum + o.pax, 0);
          let status = 'Tersedia';
          if (manualFullOffsets.includes(i) || bookedPax >= 400) status = 'Penuh';
          else if (bookedPax > 0 || i === 4 || i === 10) status = 'Slot Terbatas';
          const [y, m, d] = dateStr.split('-').map(Number);
          const dObj = new Date(y, m - 1, d);
          result.push({ dateStr, dayName: dObj.toLocaleDateString('id-ID', { weekday: 'short' }), dayNum: d, monthShort: dObj.toLocaleDateString('id-ID', { month: 'short' }), status, bookedPax });
        }
        return result;
      }, [orders]);

      const handleToggleLikePackage = (pkgId) => {
        setPackages((prev) => prev.map((p) => p.id === pkgId ? { ...p, likes: p.userLiked ? p.likes - 1 : (p.likes || 120) + 1, userLiked: !p.userLiked } : p));
      };
      const handleCreateOrder = (newOrder) => { setOrders((prev) => [newOrder, ...prev]); triggerToast(`Pesanan ${newOrder.id} berhasil masuk ke jadwal dapur Sarasa Catering!`); };
      const handleUpdateOrderStatus = (orderId, newStatus) => { setOrders((prev) => prev.map((o) => o.id === orderId ? { ...o, status: newStatus } : o)); triggerToast(`Status pesanan ${orderId} diperbarui menjadi "${newStatus}"`); };
      const handleAddPackage = (newPkg) => { setPackages((prev) => [...prev, newPkg]); triggerToast(`Paket "${newPkg.name}" berhasil ditambahkan ke Katalog & Showcase!`); };
      const handleResetDemoData = () => {
        setPackages(INITIAL_PACKAGES); setOrders(getInitialOrders());
        try {
          localStorage.removeItem('sarasa_pkgs_v2');
          localStorage.removeItem('sarasa_orders_v2');
        } catch {}
        triggerToast('Data demo berhasil dikembalikan ke pengaturan awal.');
      };

      return (
        <div className="min-h-screen bg-[#F5F3EE] text-stone-800 font-sans selection:bg-amber-200 selection:text-emerald-950">
          <style>{GLOBAL_CSS}</style>

          <header className="sticky top-0 z-40 bg-emerald-950/95 backdrop-blur-md text-white shadow-lg border-b border-emerald-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex flex-col sm:flex-row items-center justify-between gap-3">

    /* ============================================================
       9. CUSTOMER INTERACTIVE EXPERIENCE

    function CustomerInteractiveExperience({ packages, orders, calendarDates, onToggleLike, onCreateOrder, onSwitchToAdmin }) {
      const [activeIndex, setActiveIndex] = useState(0);
      const [animTriggerKey, setAnimTriggerKey] = useState(0);

        const total = packages.length;

        setAnimTriggerKey((p) => p + 1);
        const target = packages[normalized];
        if (target) {
          setSelectedPkgId(target.id);
          setPax((prev) => (prev < target.minOrder ? target.minOrder : prev));
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
          if (e.key === 'ArrowRight') handleSelectShowcaseIndex(activeIndex + 1);
          else if (e.key === 'ArrowLeft') handleSelectShowcaseIndex(activeIndex - 1);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      });

      const activeCalculatorPkg = useMemo(() => packages.find((p) => p.id === selectedPkgId) || packages[0], [packages, selectedPkgId]);
      const selectedDateInfo = useMemo(() => calendarDates.find((d) => d.dateStr === eventDate), [calendarDates, eventDate]);
      const isDateFullyBooked = selectedDateInfo?.status === 'Penuh';

      const scrollToCalculatorWithPkg = (pkg) => {
        if (pkg) { setSelectedPkgId(pkg.id); setPax((prev) => (prev < pkg.minOrder ? pkg.minOrder : prev)); }
        const el = document.getElementById('booking-calculator-section');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const handleToggleStall = (stallId) => {
        setSelectedStalls((prev) => {
          const current = prev[stallId];
          if (current?.selected) { const u = { ...prev }; delete u[stallId]; return u; }
          return { ...prev, [stallId]: { selected: true, pax: Math.max(40, pax) } };
        });
      };
      const handleStallPaxChange = (stallId, newPax) => {
        setSelectedStalls((prev) => ({ ...prev, [stallId]: { selected: true, pax: Math.max(10, Number(newPax) || 0) } }));
      };

      const pricingSummary = useMemo(() => {
        const pkgPrice = activeCalculatorPkg ? activeCalculatorPkg.price : 0;
        const validPax = Math.max(0, Number(pax) || 0);
        const mainSubtotal = pkgPrice * validPax;
        const stallDetails = [];
        let stallsSubtotal = 0;
        STALL_OPTIONS.forEach((s) => {
          const e = selectedStalls[s.id];
          if (e?.selected) {
            const sPax = Math.max(10, Number(e.pax) || validPax);
            const sub = s.price * sPax;
            stallsSubtotal += sub;
            stallDetails.push({ id: s.id, name: s.name, price: s.price, pax: sPax, subtotal: sub });
          }
        });
        const grandTotal = mainSubtotal + stallsSubtotal;
        const dpAmount = Math.round(grandTotal * 0.5);
        return { mainSubtotal, stallDetails, stallsSubtotal, grandTotal, dpAmount, remainingAmount: grandTotal - dpAmount };
      }, [activeCalculatorPkg, pax, selectedStalls]);

      const handleSubmitOrder = (e) => {
        e.preventDefault(); setFormError('');
        if (!activeCalculatorPkg) return setFormError('Silakan pilih paket catering terlebih dahulu.');
        if (Number(pax) < activeCalculatorPkg.minOrder) return setFormError(`Jumlah minimal pemesanan untuk ${activeCalculatorPkg.name} adalah ${activeCalculatorPkg.minOrder} pax.`);
        if (isDateFullyBooked) return setFormError(`Maaf, tanggal ${formatTanggalIndo(eventDate)} sudah Penuh. Silakan pilih tanggal lain.`);

      };

                  <p className="text-xs text-emerald-200 mt-1 relative z-10">Data acara Anda telah masuk ke Sistem Produksi Dapur Sarasa Catering.</p>
                  <div className="mt-3 inline-block px-3.5 py-1 rounded-full bg-emerald-900 border border-amber-400/50 text-amber-300 text-xs font-mono font-bold relative z-10">
                    Kode Booking: {confirmedOrder.id}
                  </div>
                </div>
                <div className="p-6 space-y-4">
                  <div className="bg-[#FAF8F5] rounded-2xl p-4 border border-stone-200 space-y-2 text-sm">
                    {[
                      ['Pemesan:', confirmedOrder.customerName],
                      ['Jadwal Acara:', `${formatTanggalIndo(confirmedOrder.eventDate, false)} (${confirmedOrder.eventTime})`],
                      ['Paket Utama:', `${confirmedOrder.packageName} (${confirmedOrder.pax} pax)`]
                    ].map(([k, v]) => (
                      <div key={k} className="flex justify-between">
                        <span className="text-stone-500">{k}</span><span className="font-semibold text-stone-800">{v}</span>
                      </div>
                    ))}
                    <div className="flex justify-between pt-2 border-t border-stone-200">
                      <span className="font-bold text-emerald-950">Tagihan DP (50%):</span>
                      <span className="font-extrabold text-amber-700"><AnimatedCounter value={confirmedOrder.dpAmount} /></span>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button type="button" onClick={() => handleCopyWaText(confirmedOrder)}
                      className="py-2.5 px-4 rounded-xl border border-stone-300 hover:bg-stone-100 text-stone-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all">
                      {copiedWa ? <><Check className="w-4 h-4 text-emerald-600" /><span className="text-emerald-700">Teks Tersalin!</span></> : <><Copy className="w-4 h-4" /><span>Salin Format WA</span></>}
                    </button>
                    <a href={`https://wa.me/${SARASA_CONFIG.whatsappNumber}?text=${encodeURIComponent(generateWhatsAppText(confirmedOrder))}`} target="_blank" rel="noopener noreferrer"
                      className="py-2.5 px-4 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all shadow-sm hover:scale-[1.02]">
                      <MessageCircle className="w-4 h-4" /><span>Konfirmasi via WhatsApp</span>
                    </a>
                  </div>
                  <div className="pt-2 border-t border-stone-100 flex flex-col sm:flex-row gap-2">
                    <button type="button" onClick={() => { setConfirmedOrder(null); onSwitchToAdmin(); }}
                      className="flex-1 py-2.5 px-4 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold text-xs flex items-center justify-center gap-1.5 transition-all">
                      <LayoutDashboard className="w-4 h-4" /><span>Lihat di Dashboard Admin</span>
                    </button>
                    <button type="button" onClick={() => setConfirmedOrder(null)} className="py-2.5 px-4 rounded-xl text-stone-500 hover:text-stone-800 font-semibold text-xs">Tutup</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    /* ============================================================
       10. ADMIN DASHBOARD
    ============================================================ */
    function AdminDashboard({ orders, packages, onUpdateStatus, onAddPackage, onResetDemo, onSwitchToCustomer }) {
      const [activeTab, setActiveTab] = useState('orders');
      const [statusFilter, setStatusFilter] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');
      const [invoiceOrder, setInvoiceOrder] = useState(null);

      const availableOrderDates = useMemo(() => Array.from(new Set(orders.map((o) => o.eventDate))).sort(), [orders]);
      const [selectedKitchenDate, setSelectedKitchenDate] = useState(availableOrderDates[0] || getDateOffset(3));

      useEffect(() => {
        if (!selectedKitchenDate && availableOrderDates.length > 0) setSelectedKitchenDate(availableOrderDates[0]);
      }, [availableOrderDates, selectedKitchenDate]);

      const [newPkgName, setNewPkgName] = useState('');
      const [newPkgCategory, setNewPkgCategory] = useState('Prasmanan');
      const [newPkgPlateStyle, setNewPkgPlateStyle] = useState('buffet');
      const [newPkgPrice, setNewPkgPrice] = useState(55000);
      const [newPkgHpp, setNewPkgHpp] = useState(31000);
      const [newPkgMinOrder, setNewPkgMinOrder] = useState(40);
      const [newPkgChefName, setNewPkgChefName] = useState('Chef Feny Maharani');
      const [newPkgItemsText, setNewPkgItemsText] = useState('');
      const [pkgFormError, setPkgFormError] = useState('');

      const kpiStats = useMemo(() => {
        const active = orders.filter((o) => o.status !== 'Selesai');
        return {
          activeCount: active.length,
          totalPaxScheduled: active.reduce((s, o) => s + o.pax, 0),
          totalOmzet: orders.reduce((s, o) => s + o.totalAmount, 0),
          collectedDp: orders.filter((o) => o.status !== 'Menunggu DP').reduce((s, o) => s + (o.status === 'Selesai' ? o.totalAmount : o.dpAmount), 0),
          pendingAction: orders.filter((o) => o.status === 'Menunggu DP').length
        };
      }, [orders]);

      const filteredOrders = useMemo(() => orders.filter((o) => {
        const matchStatus = statusFilter === 'Semua' || o.status === statusFilter;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q || o.id.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.packageName.toLowerCase().includes(q);
        return matchStatus && matchQuery;
      }), [orders, statusFilter, searchQuery]);

      const kitchenSummary = useMemo(() => {
        const ordersOnDate = orders.filter((o) => o.eventDate === selectedKitchenDate).sort((a, b) => a.eventTime.localeCompare(b.eventTime));
        const dishMap = {}; const stallMap = {};
        ordersOnDate.forEach((order) => {
          const pkg = packages.find((p) => p.id === order.packageId);
          const dishList = pkg ? pkg.items : [`Menu ${order.packageName}`];
          dishList.forEach((dish) => {
            if (!dishMap[dish]) dishMap[dish] = { name: dish, totalPax: 0, sources: [] };
            dishMap[dish].totalPax += order.pax; dishMap[dish].sources.push(`${order.id} (${order.pax} pax)`);
          });
          (order.stalls || []).forEach((st) => {
            if (!stallMap[st.name]) stallMap[st.name] = { name: st.name, totalPax: 0, sources: [] };
            stallMap[st.name].totalPax += st.pax; stallMap[st.name].sources.push(`${order.id} (${st.pax} pax)`);
          });
        });
        return {
          ordersOnDate,
          aggregatedDishes: Object.values(dishMap).sort((a, b) => b.totalPax - a.totalPax),
          aggregatedStalls: Object.values(stallMap).sort((a, b) => b.totalPax - a.totalPax),
          totalPax: ordersOnDate.reduce((s, o) => s + o.pax, 0)
        };
      }, [orders, packages, selectedKitchenDate]);

      const handleAddPackageSubmit = (e) => {
        e.preventDefault(); setPkgFormError('');
        if (!newPkgName.trim()) return setPkgFormError('Nama paket wajib diisi.');
        if (newPkgPrice <= 0 || newPkgHpp <= 0) return setPkgFormError('Harga & HPP harus lebih dari 0.');
        if (newPkgHpp >= newPkgPrice) return setPkgFormError('HPP tidak boleh lebih besar atau sama dengan harga jual.');
        const itemsArr = newPkgItemsText.split('\n').map((s) => s.trim()).filter(Boolean);
        if (itemsArr.length === 0) return setPkgFormError('Minimal isi 1 item menu (satu per baris).');
        onAddPackage({
          id: `pkg-${Date.now()}`, name: newPkgName.trim(), category: newPkgCategory, plateStyle: newPkgPlateStyle,
          accentTint: '#064E3B', price: Number(newPkgPrice), hpp: Number(newPkgHpp), minOrder: Number(newPkgMinOrder),
          rating: '4.8', likes: 0, chefName: newPkgChefName, chefTitle: 'Culinary Specialist',
          chefQuote: 'Paket baru yang dirancang khusus untuk melengkapi momen berharga Anda.',
          videoDuration: '02:00', videoHighlights: ['Peralatan saji higienis premium', 'Pengiriman terjadwal', 'Garansi ketepatan waktu'],
          items: itemsArr, rankLabel: '#Baru Rilis'
        });
        setNewPkgName(''); setNewPkgItemsText(''); setNewPkgPrice(55000); setNewPkgHpp(31000); setNewPkgMinOrder(40);
        setActiveTab('packages');
      };

      const TABS = [
        { id: 'orders', label: 'Pesanan & Status', icon: FileText },
        { id: 'kitchen', label: 'Kitchen Sheet (Dapur)', icon: ChefHat },
        { id: 'packages', label: 'Katalog Paket', icon: Package },
        { id: 'add-package', label: 'Tambah Paket Baru', icon: Plus }
      ];

      const STATUS_OPTIONS = ['Menunggu DP', 'DP Lunas', 'Diproses Dapur', 'Dikirim', 'Selesai'];

      return (
        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">
          <div className="no-print">
          <Reveal>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-emerald-900 bg-emerald-100 px-3 py-1 rounded-full">Dashboard Operasional</span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-emerald-950 mt-2">Pusat Kendali Sarasa Catering</h1>
                <p className="text-stone-600 text-sm mt-1">Kelola pesanan, jadwal dapur, katalog paket, dan invoice dari satu layar.</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <button type="button" onClick={onSwitchToCustomer}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white border border-stone-300 hover:border-emerald-700 text-stone-800 font-bold text-xs shadow-sm hover:shadow transition-all hover:-translate-y-0.5">
                  <Store className="w-4 h-4 text-emerald-700" /><span>Mode Customer</span>
                </button>
                <button type="button" onClick={onResetDemo}
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-800 font-bold text-xs shadow-sm hover:shadow transition-all hover:-translate-y-0.5">
                  <RotateCcw className="w-4 h-4" /><span>Reset Demo</span>
                </button>
              </div>
            </div>
          </Reveal>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8">
            {[
              { label: 'Pesanan Aktif', value: kpiStats.activeCount, suffix: ' pesanan', icon: Package, color: 'from-emerald-700 to-emerald-900', accent: 'text-amber-300' },
              { label: 'Total Pax Terjadwal', value: kpiStats.totalPaxScheduled, suffix: ' pax', icon: Users, color: 'from-amber-500 to-amber-700', accent: 'text-white' },
              { label: 'DP Terkumpul', value: kpiStats.collectedDp, prefix: 'Rp ', icon: Wallet, color: 'from-teal-700 to-emerald-900', accent: 'text-amber-300' },
              { label: 'Menunggu Tindakan', value: kpiStats.pendingAction, suffix: ' pesanan', icon: AlertCircle, color: 'from-rose-600 to-rose-800', accent: 'text-white' }
            ].map((card, i) => {
              const Icon = card.icon;
              return (
                <Reveal key={card.label} delay={i * 80}>
                  <div className={`relative overflow-hidden rounded-2xl bg-gradient-to-br ${card.color} text-white p-4 sm:p-5 shadow-lg hover:shadow-xl transition-all hover:-translate-y-1`}>
                    <div className="absolute -top-6 -right-6 w-24 h-24 rounded-full bg-white/10 blur-2xl" />
                    <div className="flex items-start justify-between relative">
                      <div>
                        <p className={`text-[10px] sm:text-xs font-bold uppercase tracking-wider ${card.accent} opacity-90`}>{card.label}</p>
                        <p className="text-xl sm:text-2xl font-black mt-1 tabular-nums">
                          <AnimatedCounter value={card.value} prefix={card.prefix || ''} />
                          <span className="text-xs font-medium opacity-90">{card.suffix || ''}</span>
                        </p>
                      </div>
                      <div className={`w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center ${card.accent}`}>
                        <Icon className="w-4 h-4" />
                      </div>
                    </div>
                  </div>
                </Reveal>
              );
            })}
          </div>

          <Reveal>
            <div className="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden">
              <div className="border-b border-stone-200 overflow-x-auto">
                <div className="flex min-w-max">
                  {TABS.map((t) => {
                    const Icon = t.icon;
                    const isActive = activeTab === t.id;
                    return (
                      <button key={t.id} type="button" onClick={() => setActiveTab(t.id)}
                        className={`relative flex items-center gap-2 px-4 sm:px-5 py-3.5 text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${isActive ? 'text-emerald-950 bg-[#FAF8F5]' : 'text-stone-500 hover:text-stone-800 hover:bg-stone-50'}`}>
                        <Icon className="w-4 h-4" /><span>{t.label}</span>
                        {isActive && <span className="absolute bottom-0 left-3 right-3 h-0.5 bg-amber-500 rounded-t-full animate-grow-x" />}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div key={activeTab} className="p-4 sm:p-6 animate-fade-in">
                {activeTab === 'orders' && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row gap-3">
                      <div className="relative flex-1">
                        <Search className="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input type="text" placeholder="Cari kode pesanan, nama, atau paket..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800" />
                      </div>
                      <div className="flex gap-2 overflow-x-auto no-scrollbar">
                        {['Semua', ...STATUS_OPTIONS].map((s) => (
                          <button key={s} type="button" onClick={() => setStatusFilter(s)}
                            className={`px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${statusFilter === s ? 'bg-emerald-950 text-amber-300 shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>
                            {s}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="overflow-x-auto rounded-2xl border border-stone-200">
                      <table className="w-full text-sm">
                        <thead className="bg-[#FAF8F5] text-stone-500">
                          <tr>
                            {['Kode', 'Pelanggan', 'Jadwal', 'Paket', 'Total', 'Status', 'Aksi'].map((h) => (
                              <th key={h} className="text-left font-bold text-[11px] uppercase tracking-wider px-3 sm:px-4 py-3 whitespace-nowrap">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {filteredOrders.length === 0 ? (
                            <tr><td colSpan={7} className="text-center py-10 text-stone-400 text-sm">Tidak ada pesanan yang sesuai filter.</td></tr>
                          ) : filteredOrders.map((o, i) => (
                            <tr key={o.id} className="border-t border-stone-100 hover:bg-amber-50/40 transition-colors animate-slide-stagger" style={{ animationDelay: `${i * 30}ms` }}>
                              <td className="px-3 sm:px-4 py-3 font-mono text-xs font-bold text-emerald-900 whitespace-nowrap">{o.id}</td>
                              <td className="px-3 sm:px-4 py-3">
                                <p className="font-bold text-stone-900 text-xs sm:text-sm">{o.customerName}</p>
                                <p className="text-[11px] text-stone-500">{o.whatsapp}</p>
                              </td>
                              <td className="px-3 sm:px-4 py-3 text-xs whitespace-nowrap">
                                <p className="font-semibold text-stone-800">{formatTanggalIndo(o.eventDate, false)}</p>
                                <p className="text-stone-500">{o.eventTime} WIB</p>
                              </td>
                              <td className="px-3 sm:px-4 py-3 text-xs">
                                <p className="font-semibold text-stone-800">{o.packageName}</p>
                                <p className="text-stone-500">{o.pax} pax</p>
                              </td>
                              <td className="px-3 sm:px-4 py-3 text-xs font-extrabold text-stone-900 whitespace-nowrap tabular-nums">{formatRupiah(o.totalAmount)}</td>
                              <td className="px-3 sm:px-4 py-3">
                                <select value={o.status} onChange={(e) => onUpdateStatus(o.id, e.target.value)}
                                  className={`text-[11px] font-bold rounded-lg px-2 py-1.5 border focus:outline-none focus:ring-2 ${o.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : o.status === 'Menunggu DP' ? 'bg-rose-100 text-rose-800 border-rose-200' : o.status === 'Dikirim' ? 'bg-sky-100 text-sky-800 border-sky-200' : 'bg-amber-100 text-amber-800 border-amber-200'} focus:ring-emerald-800`}>
                                  {STATUS_OPTIONS.map((s) => <option key={s} value={s}>{s}</option>)}
                                </select>
                              </td>
                              <td className="px-3 sm:px-4 py-3">
                                <button type="button" onClick={() => setInvoiceOrder(o)}
                                  className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-emerald-950 text-amber-300 text-[11px] font-bold hover:bg-emerald-800 transition-colors">
                                  <FileText className="w-3 h-3" /> Invoice
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'kitchen' && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row gap-3 sm:items-center justify-between">
                      <div>
                        <h3 className="font-extrabold text-lg text-emerald-950">Kitchen Sheet — Lembar Produksi Dapur</h3>
                        <p className="text-xs text-stone-500">Agregasi seluruh hidangan yang harus dimasak pada tanggal terpilih.</p>
                      </div>
                      <select value={selectedKitchenDate} onChange={(e) => setSelectedKitchenDate(e.target.value)}
                        className="rounded-xl border border-stone-300 px-3 py-2 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-emerald-800">
                        {availableOrderDates.map((d) => <option key={d} value={d}>{formatTanggalIndo(d)}</option>)}
                      </select>
                    </div>

                    {kitchenSummary.ordersOnDate.length === 0 ? (
                      <div className="text-center py-12 text-stone-400 text-sm">Tidak ada pesanan pada tanggal ini.</div>
                    ) : (
                      <>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                          <div className="rounded-2xl bg-emerald-950 text-white p-4">
                            <p className="text-[10px] uppercase font-bold text-amber-300 tracking-wider">Total Pesanan</p>
                            <p className="text-2xl font-black mt-1"><AnimatedCounter value={kitchenSummary.ordersOnDate.length} prefix="" /></p>
                          </div>
                          <div className="rounded-2xl bg-amber-500 text-emerald-950 p-4">
                            <p className="text-[10px] uppercase font-bold tracking-wider opacity-80">Total Pax</p>
                            <p className="text-2xl font-black mt-1"><AnimatedCounter value={kitchenSummary.totalPax} prefix="" /></p>
                          </div>
                          <div className="rounded-2xl bg-stone-100 border border-stone-200 p-4 col-span-2 sm:col-span-1">
                            <p className="text-[10px] uppercase font-bold text-stone-500 tracking-wider">Jenis Hidangan</p>
                            <p className="text-2xl font-black mt-1 text-emerald-950"><AnimatedCounter value={kitchenSummary.aggregatedDishes.length} prefix="" /></p>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                          <div className="rounded-2xl border border-stone-200 p-4">
                            <h4 className="font-bold text-sm text-emerald-950 mb-3 flex items-center gap-2"><Utensils className="w-4 h-4 text-amber-600" /> Daftar Hidangan Paket</h4>
                            <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                              {kitchenSummary.aggregatedDishes.map((d, i) => (
                                <div key={d.name} className="flex items-start justify-between gap-2 p-2.5 rounded-xl bg-[#FAF8F5] border border-stone-200 animate-slide-stagger" style={{ animationDelay: `${i * 30}ms` }}>
                                  <div>
                                    <p className="font-bold text-xs text-stone-900">{d.name}</p>
                                    <p className="text-[10px] text-stone-500">{d.sources.join(' • ')}</p>
                                  </div>
                                  <span className="shrink-0 px-2 py-1 rounded-lg bg-emerald-950 text-amber-300 text-[11px] font-extrabold">{d.totalPax} pax</span>
                                </div>
                              ))}
                            </div>
                          </div>
                          <div className="rounded-2xl border border-stone-200 p-4">
                            <h4 className="font-bold text-sm text-emerald-950 mb-3 flex items-center gap-2"><Flame className="w-4 h-4 text-amber-600" /> Gubukan / Live Stall</h4>
                            {kitchenSummary.aggregatedStalls.length === 0 ? (
                              <p className="text-xs text-stone-400 text-center py-8">Tidak ada pondokan/stall pada tanggal ini.</p>
                            ) : (
                              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                {kitchenSummary.aggregatedStalls.map((s, i) => (
                                  <div key={s.name} className="flex items-start justify-between gap-2 p-2.5 rounded-xl bg-amber-50/60 border border-amber-200 animate-slide-stagger" style={{ animationDelay: `${i * 30}ms` }}>
                                    <div>
                                      <p className="font-bold text-xs text-stone-900">{s.name}</p>
                                      <p className="text-[10px] text-stone-500">{s.sources.join(' • ')}</p>
                                    </div>
                                    <span className="shrink-0 px-2 py-1 rounded-lg bg-amber-500 text-emerald-950 text-[11px] font-extrabold">{s.totalPax} pax</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'packages' && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="font-extrabold text-lg text-emerald-950">Katalog Paket Aktif</h3>
                        <p className="text-xs text-stone-500">Paket yang tampil di Showcase customer secara otomatis.</p>
                      </div>
                      <button type="button" onClick={() => setActiveTab('add-package')}
                        className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-emerald-950 font-extrabold text-xs transition-all hover:scale-105">

                            <div className="flex items-center justify-between mt-3 pt-3 border-t border-stone-100">
                              <div>
                                <p className="text-[10px] text-stone-500">Harga Jual</p>
                                <p className="font-extrabold text-sm text-emerald-950">{formatRupiah(p.price)}<span className="text-[10px] font-normal text-stone-500">/pax</span></p>
                              </div>
                              <div className="text-right">
                                <p className="text-[10px] text-stone-500">Margin</p>
                                <p className="font-extrabold text-xs text-amber-700">{Math.round(((p.price - (p.hpp || 0)) / p.price) * 100)}%</p>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 mt-3 text-[10px] text-stone-500">
                              <Star className="w-3 h-3 text-amber-500 fill-current" /> {p.rating} • {p.likes || 0} suka • Min. {p.minOrder} pax
                            </div>
                          </div>
                        </Reveal>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'add-package' && (
                  <form onSubmit={handleAddPackageSubmit} className="max-w-3xl mx-auto space-y-4">
                    <div>
                      <h3 className="font-extrabold text-lg text-emerald-950">Tambah Paket Catering Baru</h3>
                      <p className="text-xs text-stone-500">Paket akan langsung muncul di katalog dan showcase customer.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Nama Paket *</label>
                        <input type="text" required value={newPkgName} onChange={(e) => setNewPkgName(e.target.value)}
                          placeholder="Contoh: Prasmanan Sunda Heritage" className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Kategori</label>
                        <select value={newPkgCategory} onChange={(e) => setNewPkgCategory(e.target.value)}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm bg-white font-bold">
                          {['Prasmanan', 'Nasi Box', 'Tumpeng', 'Snack Box', 'Live Cooking'].map((c) => <option key={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Gaya Piring (Showcase)</label>
                        <select value={newPkgPlateStyle} onChange={(e) => setNewPkgPlateStyle(e.target.value)}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm bg-white font-bold">
                          <option value="buffet">Buffet (Prasmanan)</option>
                          <option value="bento">Bento (Kotak)</option>
                          <option value="tumpeng">Tumpeng</option>
                          <option value="roast">Roast (Panggang)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Harga Jual (Rp) *</label>
                        <input type="number" min={1000} required value={newPkgPrice} onChange={(e) => setNewPkgPrice(Number(e.target.value))}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">HPP (Rp) *</label>
                        <input type="number" min={1000} required value={newPkgHpp} onChange={(e) => setNewPkgHpp(Number(e.target.value))}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Minimal Order (pax)</label>
                        <input type="number" min={1} value={newPkgMinOrder} onChange={(e) => setNewPkgMinOrder(Number(e.target.value))}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Nama Chef</label>
                        <input type="text" value={newPkgChefName} onChange={(e) => setNewPkgChefName(e.target.value)}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold uppercase text-stone-600 mb-1.5">Daftar Menu (satu per baris) *</label>
                        <textarea rows={5} required value={newPkgItemsText} onChange={(e) => setNewPkgItemsText(e.target.value)}
                          placeholder={"Nasi Putih Pandan Wangi\nRendang Daging Sapi\nAyam Bakar Madu\n..."}
                          className="w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-sm font-mono focus:ring-2 focus:ring-emerald-800 focus:outline-none" />
                      </div>
                    </div>
                    {pkgFormError && (
                      <div className="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-center gap-2 animate-shake">
                        <AlertCircle className="w-4 h-4 shrink-0" />{pkgFormError}
                      </div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setActiveTab('packages')}
                        className="px-4 py-2.5 rounded-xl text-stone-600 hover:text-stone-900 font-bold text-xs">Batal</button>
                      <MagneticButton type="submit"
                        className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-900 to-emerald-950 text-amber-300 font-extrabold text-xs flex items-center gap-2 shadow-lg shadow-emerald-950/20 shimmer-btn">
                        <Plus className="w-4 h-4" /> Tambah ke Katalog
                      </MagneticButton>
                    </div>
                  </form>
                )}
              </div>
            </div>
          </Reveal>
          </div>

          {invoiceOrder && (
            <div className="printable-invoice-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 animate-backdrop-zoom" onClick={() => setInvoiceOrder(null)}>
              <div className="printable-invoice-card bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-stone-200 animate-scale-in" onClick={(e) => e.stopPropagation()}>
                <div className="bg-emerald-950 text-white p-5 flex items-center justify-between">
                  <div>
                    <h3 className="font-extrabold text-base">Invoice — {invoiceOrder.id}</h3>
                    <p className="text-xs text-emerald-300">{formatTanggalIndo(invoiceOrder.createdAt, false)}</p>
                  </div>
                  <button type="button" onClick={() => setInvoiceOrder(null)} className="no-print text-emerald-200 hover:text-white"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 space-y-4">
                  <div className="text-center pb-3 border-b border-dashed border-stone-300">
                    <div className="inline-flex items-center gap-2 mb-1">
                      <Utensils className="w-4 h-4 text-amber-600" />
                      <span className="font-extrabold text-emerald-950 text-sm tracking-wider">{SARASA_CONFIG.brandName}</span>
                    </div>
                    <p className="text-[10px] text-stone-500">{SARASA_CONFIG.address} • {SARASA_CONFIG.phoneDisplay}</p>
                  </div>
                  <div className="text-xs space-y-1">
                    <div className="flex justify-between"><span className="text-stone-500">Kepada:</span><span className="font-bold text-stone-900">{invoiceOrder.customerName}</span></div>
                    <div className="flex justify-between"><span className="text-stone-500">Acara:</span><span className="font-semibold text-stone-800">{formatTanggalIndo(invoiceOrder.eventDate, false)} • {invoiceOrder.eventTime}</span></div>
                    <div className="flex justify-between"><span className="text-stone-500">Alamat:</span><span className="font-semibold text-stone-800 text-right max-w-[60%]">{invoiceOrder.address}</span></div>
                  </div>
                  <div className="border-t border-b border-dashed border-stone-300 py-3 space-y-1.5 text-xs">
                    <div className="flex justify-between"><span className="font-semibold">{invoiceOrder.packageName} × {invoiceOrder.pax}</span><span className="font-bold">{formatRupiah(invoiceOrder.packagePrice * invoiceOrder.pax)}</span></div>
                    {(invoiceOrder.stalls || []).map((s) => (
                      <div key={s.id} className="flex justify-between text-stone-600"><span className="pl-3">• {s.name} × {s.pax}</span><span>{formatRupiah(s.price * s.pax)}</span></div>
                    ))}
                  </div>
                  <div className="space-y-1 text-xs">
                    <div className="flex justify-between font-extrabold text-emerald-950"><span>TOTAL</span><span className="text-sm tabular-nums">{formatRupiah(invoiceOrder.totalAmount)}</span></div>
                    <div className="flex justify-between text-amber-700 font-bold"><span>DP (50%)</span><span className="tabular-nums">{formatRupiah(invoiceOrder.dpAmount)}</span></div>
                    <div className="flex justify-between text-stone-600"><span>Sisa Pelunasan</span><span className="tabular-nums">{formatRupiah(invoiceOrder.totalAmount - invoiceOrder.dpAmount)}</span></div>
                  </div>
                  <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-[11px] text-amber-900">
                    <p className="font-bold mb-0.5">Catatan Khusus:</p>
                    <p>{invoiceOrder.notes}</p>
                  </div>
                  <div className="no-print flex gap-2 pt-2">
                    <button type="button" onClick={() => window.print()}
                      className="flex-1 py-2.5 rounded-xl bg-emerald-950 text-amber-300 font-bold text-xs flex items-center justify-center gap-2 hover:bg-emerald-800 transition-colors">
                      <Printer className="w-4 h-4" /> Cetak Invoice
                    </button>
                    <button type="button" onClick={() => setInvoiceOrder(null)}
                      className="px-4 py-2.5 rounded-xl border border-stone-300 text-stone-600 font-bold text-xs hover:bg-stone-50">Tutup</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    /* ============================================================
       11. MOUNT APPLICATION
    ============================================================ */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    window.__sarasaMounted = true;

    const loadingEl = document.getElementById('loading');
    if (loadingEl) {
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.remove(), 350);
    }
  </script>
  <script>
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el && !window.__sarasaMounted) {
        el.innerHTML =
          '<p style="color:#064E3B;font-weight:700;font-size:15px;text-align:center;max-width:340px;line-height:1.5">' +
          'Gagal memuat komponen aplikasi dari CDN. Periksa koneksi internet Anda lalu muat ulang halaman.' +
          '</p>' +
          '<button type="button" onclick="location.reload()" ' +
          'style="margin-top:8px;padding:10px 20px;border-radius:12px;border:none;background:#064E3B;color:#FCD34D;font-weight:700;cursor:pointer">' +
          'Muat Ulang</button>';
      }
    }, 12000);
  </script>
</body>
</html>
