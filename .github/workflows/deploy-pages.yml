name: Deploy Sajian Catering (Production & Dev Preview)

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install & Test Backend on current branch
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Install & Test Frontend on current branch
        run: |
          npm ci
          npm test

      - name: Build Production (origin/main) into ./site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /sajian-catering/
        run: |
          git worktree add _prod_main origin/main
          cd _prod_main
          npm ci
          npx vite build --base=/sajian-catering/
          cd ..
          mkdir -p site
          cp -r _prod_main/dist/* site/
          git worktree remove --force _prod_main

      - name: Build Dev Preview (origin/dev) into ./site/preview
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /sajian-catering/preview/
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git worktree add _dev_preview origin/dev
            cd _dev_preview
            npm ci
            npx vite build --base=/sajian-catering/preview/
            cd ..
            mkdir -p site/preview
            cp -r _dev_preview/dist/* site/preview/
            git worktree remove --force _dev_preview
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    needs: test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
